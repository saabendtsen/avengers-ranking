name: CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build and deploy
        run: |
          cd ~/apps/avengers-ranking
          docker compose build
          docker compose up -d

      - name: Health check
        run: |
          sleep 3
          curl -sf http://localhost:8094/ > /dev/null
          echo "Health check passed"
